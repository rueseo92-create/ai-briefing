name: TasteLab
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko

packages:
  TasteCore:
    path: Packages/TasteCore

targets:
  TasteLab:
    type: application
    platform: iOS
    sources:
      - TasteLab
    dependencies:
      - package: TasteCore
    scheme: {}
    info:
      path: TasteLab/Info.plist
      properties:
        CFBundleDisplayName: 취향 엽서
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSApplicationCategoryType: public.app-category.healthcare-fitness
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: 엽서에 넣을 사진을 찍어요. 사진은 이 폰에만 저장돼요.
        NSLocationWhenInUseUsageDescription: 오가는 시간을 재려고 실험을 받을 때만 대략적 위치를 써요. 위치는 서버로 보내지 않아요.
        NSLocationDefaultAccuracyReduced: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.tastepostcard
        MARKETING_VERSION: 0.3.0
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
